name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run package

      - name: Create checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VSIX="open-provider-${VERSION}.vsix"
          sha256sum "${VSIX}" > "${VSIX}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VSIX="open-provider-${VERSION}.vsix"
          gh release create "${GITHUB_REF_NAME}" "${VSIX}" "${VSIX}.sha256" --verify-tag --prerelease --title "Open Provider ${GITHUB_REF_NAME}" --generate-notes
